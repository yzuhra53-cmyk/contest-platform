# Doimiy (uxlamaydigan) ishlash uchun pullik rejalar:
#   web: starter  — bepul rejadagi 15 daqiqalik uyqu yo'q, 24/7 ishlaydi;
#   db:  basic-256mb — bepul Postgres 30 kundan keyin o'chiriladi, pulligi doimiy
#        va kunlik zaxira nusxalari bilan.
# Narxlar va reja nomlarini deploydan oldin render.com/pricing'da tekshiring.
databases:
  - name: contest-db
    plan: basic-256mb
    diskSizeGB: 5
    databaseName: contest
    user: contest_user

services:
  - type: web
    name: contest-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: contest-db
          property: connectionString
      # Ichki judge sozlamalari
      - key: JUDGE_TIME_LIMIT # har bir test uchun vaqt cheklovi (soniya)
        value: "2"
      - key: JUDGE_MAX_PARALLEL # bir vaqtda tekshiriladigan yechimlar soni
        value: "2"
      # Ekrandagi vaqt mintaqasi (Toshkent = UTC+5)
      - key: APP_UTC_OFFSET_HOURS
        value: "5"
      # Safe Exam Browser Config Key(lar)i — SEB Config Tool'dan (README'ga qarang)
      - key: SEB_CONFIG_KEYS
        sync: false
      # Ixtiyoriy: talabalarga ko'rsatiladigan sebs://... havola
      - key: SEB_START_LINK
        sync: false
      # Kamera kadrlari va hodisalar necha kundan keyin o'chiriladi
      - key: PROCTOR_RETENTION_DAYS
        value: "30"
      # Bitta talabaning ketma-ket yechimlari orasidagi minimal oraliq (soniya)
      - key: SUBMIT_COOLDOWN_SECONDS
        value: "20"
