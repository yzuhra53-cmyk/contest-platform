{% extends "base.html" %}
{% block title %}Talaba kirishi · Bilim.Arena{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center auth-row">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4 p-lg-5">
        <div class="icon-tile mb-3">↗</div>
        <h1 class="h3 mb-1">Xush kelibsiz!</h1>
        <p class="text-secondary mb-4">Kirish uchun ustoz ro‘yxatga kiritgan ma’lumotlaringizni to‘ldiring.</p>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <label class="form-label" for="hemis_id">HEMIS ID</label>
          <input class="form-control mb-3" id="hemis_id" name="hemis_id" autocomplete="username" maxlength="40" required autofocus>
          <label class="form-label" for="full_name">F.I.O</label>
          <input class="form-control mb-3" id="full_name" name="full_name" autocomplete="name" maxlength="180" required>
          <label class="form-label" for="group_name">Guruh</label>
          <input class="form-control mb-4" id="group_name" name="group_name" maxlength="100" required>
          <button class="btn btn-primary w-100">Davom etish</button>
        </form>
        <div class="text-center mt-4"><a class="small text-decoration-none" href="{{ url_for('admin_login') }}">Ustoz sifatida kirish →</a></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
