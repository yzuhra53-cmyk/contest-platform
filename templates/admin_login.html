{% extends "base.html" %}
{% block title %}Ustoz kirishi · Bilim.Arena{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center auth-row">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4 p-lg-5">
        <div class="icon-tile mb-3">✦</div>
        <h1 class="h3 mb-1">Ustoz paneli</h1>
        <p class="text-secondary mb-4">Boshqaruv paneliga kirish</p>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <label class="form-label" for="username">Login</label>
          <input class="form-control mb-3" id="username" name="username" autocomplete="username" required autofocus>
          <label class="form-label" for="password">Parol</label>
          <input class="form-control mb-4" id="password" name="password" type="password" autocomplete="current-password" required>
          <button class="btn btn-primary w-100">Kirish</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
